.k{font-size:12px;color:var(--mu)}.v{font-size:25px;font-weight:700;margin:4px 0}
.up{color:#059669}.dn{color:var(--red)}

.ok{background:#d1fae5;color:#065f46}.wa{background:#fef3c7;color:#92400e}.er{background:#fee2e2;color:#991b1b}.in2{background:#dbeafe;color:#1e40af}

.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));transition:width 1s}

.wrap{overflow-x:auto}.cv{position:relative;height:230px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
